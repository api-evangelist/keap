    base_url: https://api.infusionsoft.com/crm/rest/v1
    reference: https://developer.infusionsoft.com/docs/rest/
    spec: https://crm.infusionsoft.com/app/v3/api-docs/V1
    operations: 141
    note: >-
      Still the only surface carrying REST Hooks (webhook subscriptions),
      Appointments, and the Account Info endpoints — v1 is not a strict subset of v2.
  - version: XML-RPC
    status: Deprecated
    base_url: https://api.infusionsoft.com/crm/xmlrpc
    reference: https://developer.infusionsoft.com/docs/xml-rpc/
    table_schema: https://developer.infusionsoft.com/docs/table-schema/
    retirement_date: null
    note: >-
      Marked "Deprecated" in Keap's own developer-guide status table. No sunset date
      is published. Keap advises migrating to REST to "future-proof against XMLRPC
      API deprecation".
deprecations:
  - item: Legacy API Key (XML-RPC)
    status: deprecating
    announced_page: https://developer.infusionsoft.com/legacy-key-deprecation/
    migration_page: https://developer.infusionsoft.com/legacy-key-migration/
    replacement: [Service Account Key, Personal Access Token, OAuth2]
    interim_workaround: >-
      Legacy Keys continue to work on XML-RPC if sent as `Authorization: Bearer <key>`
      against https://api.infusionsoft.com/crm/xmlrpc.
    brownouts: true
    brownout_schedule: https://docs.google.com/document/d/1TyiF0U3TO09hz-d0R26E9wb9EIBS1wpGrCyl2WjSxCU/preview
    retirement_date: null
    note: >-
      Keap states it plans to deactivate all Legacy Keys "at a point in the near
      future" and is running periodic brownouts to help consumers find affected
      integrations. No dated deadline is published.
  - item: XML-RPC API
    status: deprecated
    retirement_date: null
