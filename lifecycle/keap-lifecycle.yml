summary: >-
  Keap publishes an explicit, three-state API lifecycle table in its developer guide
  — REST v2 "Default", REST v1 "Current", XML-RPC "Deprecated" — plus a named,
  in-flight deprecation of Legacy API Keys with a documented migration path and
  scheduled brownouts. Status is reported through the parent company's Statuspage,
  which carries a dedicated "Keap" component. What is missing is machine-readable
  deprecation: no Sunset or Deprecation response headers (RFC 8594) are documented,
  no operation in either contract carries `deprecated: true`, and no retirement date
  is published for XML-RPC or Legacy Keys.
versioning:
  scheme: path-segment major version
  pattern: https://api.infusionsoft.com/crm/rest/{v1|v2}
  current: v2
  note: >-
    The v2 OpenAPI reports info.version "v2" from the live endpoint; the dated
    snapshot on the docs host reports "2.70.0.872719-hf-202511041049", so a build
    identifier exists internally but is not part of the request contract.
api_versions:
  - version: v2
    status: Default
    base_url: https://api.infusionsoft.com/crm/rest/v2
    alternate_host: https://api.keap.com/crm/rest/v2
    reference: https://developer.infusionsoft.com/docs/restv2/
