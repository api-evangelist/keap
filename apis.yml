apis:
- aid: keap:rest-hooks
  name: Keap REST Hooks
  description: >-
    Keap REST Hooks webhook surface. Subscribers register a `hookUrl` and `eventKey` via the v1 REST API
    (`POST /rest/v1/hooks`), complete an `X-Hook-Secret` verification handshake, then receive HTTP POST
    deliveries when contact, contactGroup, opportunity, invoice, order, and subscription events occur.
    Event types follow `noun.verb` dot-syntax (for example `contact.add`, `invoice.delete`).
  humanURL: https://developer.infusionsoft.com/rest-hook-documentation/
  baseURL: https://api.infusionsoft.com/crm/rest/v1/hooks
  tags:
  - Webhooks
  - REST Hooks
  - Events
  - CRM
  - Contacts
  - Opportunities
  - Invoices
  - Orders
  - Subscriptions
