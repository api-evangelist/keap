aid: keap
name: Keap
description: Keap (formerly Infusionsoft, now part of Thryv) is a CRM, sales and marketing automation
  platform for small businesses that combines contact management, email and text marketing, e-commerce,
  affiliate management and pipeline automation. Keap publishes two live OpenAPI 3.1 contracts covering
  540 operations — REST v2 (399 operations, the Default version) and REST v1 (141 operations, still the
  only home of REST Hooks webhooks and Appointments) — plus a deprecated XML-RPC surface. Authentication
  is OAuth 2.0 authorization code with rotating refresh tokens, or Personal Access Tokens and Service
  Account Keys, all with a single `full` scope. Keap also operates an undocumented but live remote MCP
  server at https://api.keap.com/mcp secured with OAuth 2.1, PKCE and dynamic client registration, and
  ships first-party SDKs for six languages generated in lock-step from its own spec.
type: Index
