summary: >-
  Keap has consolidated to a SINGLE published product tier — "Keap Platform" — after
  its acquisition by Thryv; the older Pro/Max/Max Classic ladder is no longer on the
  public pricing page. Everything else on that page is an add-on. There is no
  API-specific or developer-specific plan: API access is a feature of the product
  subscription, and the API rate limits in rate-limits/keap-rate-limits.yml are set
  by token type and tenant, not by plan. A free trial exists and requires no credit
  card, but is feature-limited (25 email sends, no payments, no text messaging).
