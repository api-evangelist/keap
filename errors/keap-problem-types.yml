rfc9457: false
summary: >-
  Keap declares an identical error block on EVERY operation — 8 error statuses on all
  399 v2 operations and 10 on all 141 v1 operations, uniformly, with no
  operation-specific error documentation anywhere. The envelope is a
  `google.rpc.Status` shape (code / message / status / details[]), not RFC 9457
  problem+json, and the media type is application/json. Two consequences matter for
  agents: (1) 429 is NOT declared on any operation even though Keap documents hard
  rate limits and tells clients to expect it, so the single most likely runtime
  failure is invisible to a spec-driven client; (2) because the error set is uniform,
  the spec gives no signal about which operations can actually 409 or 412 — that has
  to be learned at runtime.
envelope:
  media_type: application/json
  schema: Error
  fields:
    - name: code
      type: integer
      format: int32
      note: Numeric status code; mirrors the HTTP status in observed Keap responses.
    - name: message
      type: string
      note: Human-readable message.
    - name: status
      type: string
      note: Symbolic status string (google.rpc.Code style, e.g. INVALID_ARGUMENT).
    - name: details
      type: array
      items: ErrorDetails
      note: 'v2 only. ErrorDetails carries {domain, resource} — no field-level path.'
  example_gateway_error:
    note: >-
      The Apigee gateway in front of the API returns a DIFFERENT envelope for
      auth failures before the API is reached, observed live at
      https://api.infusionsoft.com/crm/rest/v1/swagger.json —
      {"fault":{"faultstring":"Invalid access token","detail":{"errorcode":"oauth.v2.InvalidAccessToken"}}}.
      Clients must handle both shapes.
problem_types:
  - status: 400
    title: Bad Request
    declared_on: {v2: 399, v1: 141}
    remediation: >-
      Validate filter expressions, update_mask field names and enum values. Keap's
      filter mini-language rejects unknown field names.
  - status: 401
    title: Unauthorized
    declared_on: {v2: 399, v1: 141}
    remediation: >-
      Access token expired or missing. Refresh using the rotating refresh token; the
      new refresh token must be persisted. May also surface as the Apigee
      oauth.v2.InvalidAccessToken fault envelope.
  - status: 403
