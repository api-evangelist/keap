summary: >-
  Keap conforms to OAuth 2.0 (authorization code + refresh, with rotating refresh
  tokens) on the REST API, and its newer MCP surface goes further — RFC 9728
  protected-resource metadata, RFC 8414 authorization-server metadata, PKCE S256 and
  OAuth 2.1 dynamic client registration. The v2 REST contract follows Google's AIP
  conventions closely enough to be worth recording as a de-facto design standard. It
  does NOT conform to RFC 9457 problem details, does not implement OpenID Connect,
  publishes no idempotency mechanism, and does not implement RFC 8594 deprecation
  headers. On compliance: Keap publishes a HIPAA Business Associate Agreement for the
  CRM, but no SOC 2 / ISO 27001 / PCI attestation is published on any Keap or Thryv
  page reachable without a sales conversation.
