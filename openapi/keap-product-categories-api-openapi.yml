        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssignedProductsResponse'
components:
  schemas:
    AssignProductsRequest:
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
      - product_ids
    AssignedProducts:
      type: object
      properties:
        product_category_id:
          type: string
          description: The product category ID
          example: 123
        product_ids:
          type: array
          description: Assigned product IDs
          items:
            type: string
    CreateProductCategoryRequest:
      type: object
      description: productCategory
      properties:
        name:
          type: string
          description: The category name
          example: Electronics
        display_order_index:
          type: integer
          format: int32
          description: Display order of the category
          example: 0
        parent_category_id:
          type: string
          description: Parent category ID for subcategories
          example: 2
      required:
      - name
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    ListAssignedProductsResponse:
      type: object
      properties:
        assigned_product_categories:
          type: array
          items:
            $ref: '#/components/schemas/AssignedProducts'
        next_page_token:
          type: string
    ListProductCategoriesResponse:
      type: object
      properties:
        product_categories:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'
        next_page_token:
          type: string
    ProductCategory:
      type: object
      properties:
        id:
          type: string
          description: The product category ID
          example: 1
        name:
          type: string
          description: The category name
          example: Electronics
        display_order_index:
          type: integer
          format: int32
          description: Display order of the category
          example: 0
        parent_category_id:
          type: string
          description: Parent category ID for subcategories
          example: 2
    UpdateProductCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: The category name
          example: Electronics
        display_order_index:
          type: integer
          format: int32
          description: Display order of the category
          example: 0
        parent_category_id:
          type: string
          description: Parent category ID for subcategories
          example: 2
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.infusionsoft.com/app/oauth/authorize
          tokenUrl: https://api.infusionsoft.com/token
          scopes: {}
security:
- oauth2: []
