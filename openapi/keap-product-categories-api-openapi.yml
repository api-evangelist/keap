paths:
  /rest/v2/productCategories:
    get:
      tags:
      - Product Categories
      summary: List all Product Categories
      description: Retrieves a list of Product Categories
      operationId: listProductCategories
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:

          - (String) `product_id`

          - (String) `name` - Wildcard matching allowed

          - (Number) `product_category_id` - supports comparison operators: `==`,`!=`, `>`, `<`, `>=`,
          `<=`


          You will need to apply the `==` operator to check the equality of one of the filters with your
          searched

          word, in the encoded form `%3D%3D`.


          For fields which allow wildcard matching, you may use the * wildcard character (or its encoded
          form %2A)

          for case-insensitive partial matching on text fields. Example of a valid pattern of wildcard
          usage:

          - `field==foo*` finds anything in `field` that begins with `foo`


          For the filters listed above, here are some examples:

          - `filter=product_id%3D%3D29`

          - `filter=name%3D%3DTestSearch`

          - `filter=name%3D%3DElec*` (starts with "Elec")

          - `filter=product_category_id>5` (category ID greater than 5)

          - `filter=product_category_id>=10` (category ID greater than or equal to 10)

          - `filter=product_category_id%3D%3D42` (category ID equals 42)

          - `filter=name%3D%3DElec*%3Bproduct_category_id>5` (multiple filters combined)

          '
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `id`


          One of the following directions:

          - `asc`

          - `desc`'
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductCategoriesResponse'
    post:
      tags:
      - Product Categories
      summary: Create a Product Category
      description: Creates a new Product Category
      operationId: createProductCategory
      requestBody:
        content:
          application/json:
            schema:
