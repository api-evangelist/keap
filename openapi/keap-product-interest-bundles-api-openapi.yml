    patch:
      tags:
      - Product Interest Bundles
      summary: Update a Product Interest Bundle
      description: Updates an existing Product Interest Bundle.
      operationId: updateProductInterestBundle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: update_mask
        in: query
        description: An optional list of properties to be updated. If set, only the provided properties
          will be updated and others will be skipped.
        required: false
