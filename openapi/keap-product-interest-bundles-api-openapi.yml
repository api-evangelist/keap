      summary: Update a Product Interest in an existing Bundle
      description: Updates an existing Product Interest in an existing Bundle.
      operationId: updateProductInterest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: interest_id
        in: path
        required: true
        schema:
          type: string
      - name: update_mask
        in: query
        description: An optional list of properties to be updated. If set, only the provided properties
          will be updated and others will be skipped.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - quantity
            - price
            - discount_percent
          uniqueItems: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductInterestRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
