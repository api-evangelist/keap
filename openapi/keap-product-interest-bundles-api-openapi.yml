      summary: Delete a Product Interest from an existing Bundle
      description: Deletes an existing Product Interest from an existing Bundle.
      operationId: removeProductInterest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: interest_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '401':
