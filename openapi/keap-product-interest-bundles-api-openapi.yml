components:
  schemas:
    AddProductInterestRequest:
      type: object
      properties:
        type:
          type: string
          description: The product interest type.
          enum:
          - PRODUCT
          - SUBSCRIPTION_PLAN
          example: PRODUCT
        entity_id:
          type: string
          description: "The `product_id` (when the `type` is set to `PRODUCT`)\n or the `subscription_plan_id`\
            \ (when the `type` is set to `SUBSCRIPTION_PLAN`).\n"
          example: 123
        price:
          type: number
          format: double
          description: The price per unit of the product.
          example: 10000
        quantity:
          type: integer
          format: int32
          description: Defaults to `1`.
          example: 1
        discount_percent:
          type: integer
          format: int32
          description: Defaults to `0`.
          example: 10
      required:
      - entity_id
      - price
      - type
    CreateProductInterestBundleRequest:
      type: object
      properties:
        name:
          type: string
          description: Product interest bundle name
          example: Premium Bundle
        description:
          type: string
          description: Product interest bundle description
          example: Bundle of premium products
      required:
      - description
      - name
    CurrencyValue:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          description: The price amount in the smallest currency unit
          example: 10000
        currency_code:
          type: string
          description: Three-letter ISO currency code
          example: USD
        formatted_amount:
          type: string
          description: The product amount formatted using the tenant's currency locale
          example: $100.00
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    ListProductInterestBundleResponse:
      type: object
      properties:
        product_interest_bundles:
          type: array
          items:
            $ref: '#/components/schemas/ProductInterestBundle'
        next_page_token:
          type: string
    ProductInterest:
      type: object
      properties:
        id:
          type: string
          description: The product interest ID
          example: 456
        type:
          type: string
          description: The product interest type
          enum:
          - PRODUCT
          - SUBSCRIPTION_PLAN
          example: PRODUCT
        quantity:
          type: integer
          format: int32
          description: The quantity of product.
          example: 1
        price:
          $ref: '#/components/schemas/CurrencyValue'
          description: The price per unit of the product.
        interest_id:
          type: string
          description: The interest ID
          example: 789
        discount_percent:
          type: integer
          format: int32
          description: The percent to discount the product. Percent represented in a whole number, for
            example 10 is 10%
          example: 10
    ProductInterestBundle:
      type: object
      properties:
        id:
          type: string
          description: The product interest bundle ID
          example: 123
        name:
          type: string
          description: Product interest bundle name
          example: Premium Bundle
        description:
          type: string
          description: Product interest bundle description
          example: Bundle of premium products
        product_interests:
          type: array
          description: Product interests
          items:
            $ref: '#/components/schemas/ProductInterest'
        subscription_plan_interests:
          type: array
          description: Subscription plan interests
          items:
            $ref: '#/components/schemas/ProductInterest'
    UpdateProductInterestBundleRequest:
      type: object
      properties:
        name:
          type: string
          description: Product interest bundle name
          example: Premium Bundle
        description:
          type: string
          description: Product interest bundle description
          example: Bundle of premium products
    UpdateProductInterestRequest:
      type: object
      properties:
        price:
          type: number
          format: double
          description: The price per unit of the product.
          example: 10000
        quantity:
          type: integer
          format: int32
          description: The quantity of product.
          example: 1
        discount_percent:
          type: integer
          format: int32
          description: The percent to discount the product.
          example: 10
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.infusionsoft.com/app/oauth/authorize
          tokenUrl: https://api.infusionsoft.com/token
          scopes: {}
security:
- oauth2: []
