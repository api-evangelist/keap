        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectModel'
components:
  schemas:
    CheckListItemDetails:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        required:
          type: boolean
        instance_id:
          type: integer
          format: int64
        item_order:
          type: integer
          format: int32
        done_date:
          type: string
          format: date-time
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
          description: Checklist item ID
          example: 101
        description:
          type: string
          description: Item description
          example: Send proposal document
        required:
          type: boolean
          description: Whether item is required
          example: true
        order:
          type: integer
          format: int32
          description: Display order
          example: 1
    CreateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        tab_id:
          type: string
    CreateCustomFieldOptionRequest:
      type: object
      properties:
        label:
          type: string
    CreateCustomFieldRequest:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreateCustomFieldOptionRequest'
        field_type:
          type: string
          enum:
          - CURRENCY
          - DATE
          - DATE_TIME
          - DAY_OF_WEEK
          - DECIMAL_NUMBER
          - DRILLDOWN
          - DROPDOWN
          - EMAIL
          - LIST_BOX
          - MONTH
          - NAME
          - PERCENT
          - PHONE_NUMBER
          - RADIO
          - SOCIAL_SECURITY_NUMBER
          - STATE
          - TEXT
          - TEXT_AREA
          - USER
          - USER_LIST_BOX
          - WEBSITE
          - WHOLE_NUMBER
          - YEAR
          - YES_NO
        group_id:
          type: string
          description: An optional tab group to place the field under in the interface.  If not specified,
            will default to the 'Custom Fields' tab.
        user_group_id:
          type: string
          description: An optional user group to choose from when selecting values for User or UserListBox
            fields.
      required:
      - field_type
      - label
    CreateCustomFieldTabRequest:
      type: object
      properties:
        name:
          type: string
    CreateOpportunityRequest:
      type: object
      description: opportunity
      properties:
        opportunity_title:
          type: string
          description: Opportunity title
          example: New Business Deal
        next_action_time:
          type: string
          description: Next action timestamp (ISO-8601)
          example: '2024-03-20T10:00:00Z'
        next_action_notes:
          type: string
          description: Notes for next action
          example: Schedule demo call
        opportunity_notes:
          type: string
          description: General notes
          example: Prospect from website inquiry
        estimated_close_time:
          type: string
          description: Estimated close timestamp (ISO-8601)
          example: '2024-04-15T00:00:00Z'
        include_in_forecast:
          type: boolean
          description: Include in sales forecast
          example: true
        projected_revenue_low:
          type: number
          format: double
          description: Low revenue estimate
          example: 5000.0
        projected_revenue_high:
          type: number
          format: double
          description: High revenue estimate
          example: 10000.0
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        stage_id:
          type: string
          description: Pipeline stage ID
          example: 2
        user_id:
          type: string
          description: Assigned user ID
          example: 456
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
        affiliate_id:
          type: string
          description: Affiliate ID
          example: 789
      required:
      - contact_id
      - opportunity_title
      - stage_id
    CreateOpportunityStageChecklistItem:
      type: object
      properties:
        description:
          type: string
        required:
          type: boolean
          example: true
        order:
          type: integer
          format: int32
          description: Must be Numeric could be negative values as well for ordering
          examples:
          - '-2'
          - '1'
      required:
      - description
      - order
      - required
    CreateOpportunityStageRequest:
      type: object
      description: opportunity
      properties:
        name:
          type: string
          example: Won
        order:
          type: integer
          format: int32
          example: 5
        target_number_days:
          type: integer
          format: int32
          example: 10
          minimum: 0
        probability:
          type: integer
          format: int32
          example: 42
          maximum: 100
          minimum: 0
        checklist_items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOpportunityStageChecklistItem'
      required:
      - name
      - order
      - probability
      - target_number_days
    CustomField:
      type: object
      properties:
        content: {}
        id:
          type: string
    CustomFieldGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        tab_id:
          type: string
        record_type:
          type: string
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
    CustomFieldMetaData:
      type: object
      description: Metadata describing a custom field, including its type and options
      properties:
        id:
          type: string
          description: The unique identifier of the custom field
          example: 123
        label:
          type: string
          description: The display label of the custom field
          example: Favorite Color
        options:
          type: array
          description: The list of available options for select/radio/multiselect/drilldown field types
          items:
            $ref: '#/components/schemas/CustomFieldOption'
        record_type:
          type: string
          description: The entity type this custom field belongs to (e.g. CONTACT, COMPANY)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
        field_type:
          type: string
          description: The data type of the custom field (e.g. Text, Number, Date, Select)
          enum:
          - CURRENCY
          - DATE
          - DATE_TIME
          - DAY_OF_WEEK
          - DECIMAL_NUMBER
          - DRILLDOWN
          - DROPDOWN
          - EMAIL
          - LIST_BOX
          - MONTH
          - NAME
          - PERCENT
          - PHONE_NUMBER
          - RADIO
          - SOCIAL_SECURITY_NUMBER
          - STATE
          - TEXT
          - TEXT_AREA
          - USER
          - USER_LIST_BOX
          - WEBSITE
          - WHOLE_NUMBER
          - YEAR
          - YES_NO
        default_value:
          type: string
          description: The default value for this custom field, if any
        group_id:
          type: string
          description: The ID of the group this custom field belongs to
          example: 45
        group_name:
          type: string
          description: The name of the group this custom field belongs to
          example: Personal Info
        field_name:
          type: string
          description: The database column name for this custom field. Use this value when filtering contacts
            (e.g. for field_name 'firstName1', filter with 'firstName1==John').
          example: firstName1
    CustomFieldOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
    CustomFieldTab:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the custom field tab
          example: 123
        name:
          type: string
          description: The name of the custom field tab
          example: Personal Info
        order:
          type: integer
          format: int32
          description: The display order of the tab
          example: 1
        record_type:
          type: string
          description: The record type this tab belongs to (e.g., CONTACT, COMPANY, OPPORTUNITY, REFERRAL_PARTNER,
            ORDER, SUBSCRIPTION, TASK_NOTE_APPOINTMENT)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
          example: CONTACT
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    ListCustomFieldGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldGroup'
    ListCustomFieldTabsResponse:
      type: object
      properties:
