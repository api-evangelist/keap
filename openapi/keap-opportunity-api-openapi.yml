          $ref: '#/components/schemas/StageDetails'
          description: Stage details
        reasons:
          type: array
          description: Stage change reasons
          items:
            type: string
      required:
      - id
    OpportunityStageMove:
      type: object
      description: Historical record of an opportunity moving from one pipeline stage to another
      properties:
        id:
          type: string
          description: Unique ID of this stage-move record
          example: 42
        opportunity_id:
          type: string
          description: ID of the opportunity that was moved
          example: 7
        move_time:
          type: string
          description: Date-time when the move occurred (ISO-8601 UTC)
          example: 2024-03-15T10:30:00.000+0000
        move_from_stage_id:
          type: string
          description: ID of the stage moved FROM. 0 = no previous stage (first move)
          example: 3
        move_to_stage_id:
          type: string
          description: ID of the stage moved TO
          example: 5
        prev_stage_move_time:
          type: string
          description: Date-time of the previous stage-move (ISO-8601 UTC). Null if first move.
          example: 2024-02-10T08:00:00.000+0000
        user_id:
          type: string
          description: ID of the user associated with this move
          example: 1
        created_by:
          type: string
          description: ID of the user who created this record
          example: 1
        create_time:
          type: string
          description: Date-time this record was created (ISO-8601 UTC)
          example: 2024-03-15T10:30:00.000+0000
