          type: string
    ObjectModel:
      type: object
      properties:
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldMetaData'
        optional_properties:
          type: array
          description: These fields are not transmitted by default on this model, but can be requested
            by specifying them in a comma-separated list in the optional_properties query parameter.
          items:
            type: string
          uniqueItems: true
    OpportunityContact:
      type: object
      properties:
        id:
          type: string
          description: Contact ID
          example: 1001
        email:
          type: string
          description: Email address
          example: john.smith@example.com
        city:
          type: string
          description: City
          example: Chandler
        state:
          type: string
          description: State
          example: AZ
        first_name:
          type: string
          description: First name
          example: John
        last_name:
          type: string
          description: Last name
          example: Smith
        company_name:
          type: string
          description: Company name
          example: Acme Corp
        job_title:
          type: string
          description: Job title
          example: Sales Manager
        phone_number:
          type: string
          description: Phone number
          example: 5551234567
      required:
      - id
    OpportunityStage:
      type: object
      properties:
        id:
          type: string
          description: Stage ID
          example: 1
        name:
          type: string
          description: Stage name
          example: Qualified
