components:
  schemas:
    CreateEmailSentRequest:
      type: object
      description: Request to create an email record
      properties:
        subject:
          type: string
          description: The subject of the email
          example: Welcome to our service
        headers:
          type: string
          description: Email headers
          example: 'X-Custom-Header: value'
        contact_id:
          type: string
          description: The contact ID who received the email
          example: 456
        sent_to_address:
          type: string
          description: The email address the email was sent to
          example: john@example.com
        sent_to_cc_address_list:
          type: array
          description: List of CC email addresses
          example:
          - cc1@example.com
          - cc2@example.com
          items:
            type: string
        sent_to_bcc_address_list:
          type: array
          description: List of BCC email addresses
          example:
          - bcc@example.com
          items:
            type: string
        sent_from_address:
          type: string
          description: The sender's email address
          example: sender@company.com
        sent_from_reply_address:
          type: string
          description: The reply-to email address
          example: reply@company.com
        sent_time:
          type: string
          format: date-time
          description: When the email was sent, in ISO-8601 format. If omitted, the stored sent_time will
            be null.
          example: '2024-05-21T14:30:00Z'
        received_time:
          type: string
          format: date-time
          description: When the email was received, in ISO-8601 format
          example: '2024-05-21T14:31:00Z'
        opened_time:
          type: string
          format: date-time
          description: When the email was opened, in ISO-8601 format
          example: '2024-05-21T15:00:00Z'
        clicked_time:
          type: string
          format: date-time
          description: When a link in the email was clicked, in ISO-8601 format
          example: '2024-05-21T15:05:00Z'
        plain_content:
          type: string
          description: Base64 encoded text
          example: V2VsY29tZSB0byBvdXIgc2VydmljZQ==
        html_content:
          type: string
          description: Base64 encoded HTML
          example: PGgxPldlbGNvbWU8L2gxPg==
        original_provider:
          type: string
          description: Provider that sent the email, defaults to UNKNOWN
          enum:
          - UNKNOWN
          - INFUSIONSOFT
          - MICROSOFT
          - GOOGLE
          example: INFUSIONSOFT
        original_provider_id:
          type: string
          description: Provider id that sent the email, must be unique when combined with provider. If
            omitted a UUID without dashes is autogenerated for the record.
          example: msg_abc123
        provider_source_id:
          type: string
          description: The email address of the synced email account that generated this message.
          example: sync@company.com
      required:
      - sent_to_address
    CreateEmailsSentRequest:
      type: object
      description: Email records to persist, with content.
      properties:
        emails:
          type: array
          description: Collection of email records to create, maximum 1000
          items:
            $ref: '#/components/schemas/CreateEmailSentRequest'
      required:
      - emails
    DeleteEmailsRequest:
      type: object
      description: Request to delete multiple email records
      properties:
        email_ids:
          type: array
          description: List of email IDs to delete
          example:
          - '123'
          - '456'
          - '789'
          items:
            type: string
      required:
      - email_ids
    DeleteEmailsResponse:
      type: object
      description: Response from deleting email records
      properties:
        results:
          type: object
          additionalProperties:
            type: string
          description: Map of email ID to deletion result (SUCCESS, NO_PERMISSION, EMAIL_ID_NOT_FOUND)
    EmailSendRequest:
      type: object
      description: Request to send an email to contacts
      properties:
        contacts:
          type: array
          description: An array of Contact Ids to receive the email
          example:
          - '1'
          - '2'
          - '3'
          items:
            type: string
        subject:
          type: string
          description: The subject line of the email
          example: Welcome to our newsletter
        attachments:
          type: array
          description: Attachments to be sent with each copy of the email, maximum of 10 with size of
            1MB each
          items:
            $ref: '#/components/schemas/EmailSendRequestAttachment'
          uniqueItems: true
        user_id:
          type: string
          description: The user ID to send the email on behalf of. Exactly one of user_id or from_address
            is required.
          example: 1
        from_address:
          type: string
          description: The authenticated sender email address to send from. Exactly one of user_id or
            from_address is required.
          example: sales@example.com
        html_content:
          type: string
          description: The HTML-formatted content of the email, encoded in Base64
          example: PGgxPldlbGNvbWU8L2gxPg==
        plain_content:
          type: string
          description: The plain-text content of the email, encoded in Base64
          example: V2VsY29tZSB0byBvdXIgbmV3c2xldHRlcg==
        address_field:
          type: string
          description: Email field of each Contact record to address the email to, such as 'Email', 'EmailAddress2',
            'EmailAddress3' or '_CustomFieldName', defaulting to the contact's primary email
          example: EMAIL1
      required:
      - contacts
      - subject
    EmailSendRequestAttachment:
      type: object
      description: An attachment for an email
      properties:
        file_name:
          type: string
          description: 'The filename of the attached file, including extension. The extension determines
            whether the attachment is accepted; only the following extensions are supported (case-insensitive):

            - Image: bmp, cdr, fpx, gif, jif, jiff, jp2, jpeg, jpg, jpx, j2k, pcd, pdf, png, psd, pspimage,
            thm, tif, tiff, yuv

            - Text/Document: doc, docx, err, log, msg, notes, pages, pwd, rtf, text, txt, vcf, wp, wp4,
            wp5, wp7, wpd, wps, wsd, xdl

            - Audio: mid, mp3, mp4, wav, wma

            - Video: avi, divx, f4p, flv, gvi, hdmov, hdv, m2ts, m4v, mnv, mov, movie, mp4, mp4v, mpeg,
            mpeg1, mpeg4, mpg, qt, rm, vob, wm, wmv

            - Data: csv, ics, key, pps, ppt, pptx, xlr, xls, xlsx, xml, zip


            Requests including an attachment with any other extension return `400 Bad Request` with the
            message "attachment type is invalid".

            '
          example: document.pdf
        file_data:
          type: string
          description: The content of the attachment, encoded in Base64
          example: JVBERi0xLjQKJeLjz9MK...
      required:
      - file_data
      - file_name
    EmailSendTemplateRequest:
      type: object
      description: 'Use a template to send an email to a list of contacts '
      properties:
        template_id:
          type: string
          description: Template ID
          example: 123
        contact_ids:
          type: array
          description: List of contact IDs to send the email to
          example:
          - '1'
          - '2'
          - '3'
          items:
            type: string
        user_id:
          type: string
          description: The user ID to send the email on behalf of
          example: 1
        address_field:
          type: string
          description: Email field of each Contact record to address the email to, such as 'Email', 'EmailAddress2',
            'EmailAddress3' or '_CustomFieldName', defaulting to the contact's primary email
          example: EMAIL1
      required:
      - contact_ids
      - template_id
      - user_id
    EmailSent:
      type: object
      description: A sent email record
      properties:
        id:
          type: string
          description: The unique identifier of the email
          example: 123
        subject:
          type: string
          description: The subject of the email
          example: Welcome to our service
        headers:
          type: string
          description: Email headers
          example: 'X-Custom-Header: value'
        contact_id:
          type: string
          description: The contact ID who received the email
          example: 456
