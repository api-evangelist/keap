paths:
  /rest/v2/discounts/products:
    get:
      tags:
      - Product Discounts
      summary: List all Product Discounts
      description: Retrieves a list of Product Discounts
      operationId: listProductDiscounts
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:

          - (Boolean) `apply_to_commissions`

          - (DiscountType) `discount_type`: AMOUNT or PERCENT

          - (Double) `discount_value`

          - (String) `product_id`


          You will need to apply the `==` operator to check the equality of one of the filters with your searched

          word, in the encoded form `%3D%3D`. For the filters listed above, here are some examples:

          - `filter=apply_to_commissions%3D%3Dtrue`

          - `filter=discount_type%3D%3DAMOUNT`

          - `filter=discount_value%3D%3D10.0`

          - `filter=product_id%3D%3D2`

          - `filter=discount_type%3D%3DAMOUNT%3Bdiscount_value%3D%3D10.0`

          '
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `apply_to_commissions`

          - `discount_type`

          - `discount_value`

          - `id`

          - `name`

          - `product_id`


          One of the following directions:

          - `asc`

          - `desc`'
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductDiscountsResponse'
    post:
      tags:
      - Product Discounts
      summary: Create a Product Discount
      description: Creates a Product Discount
      operationId: createProductDiscount
      requestBody:
        content:
          application/json:
