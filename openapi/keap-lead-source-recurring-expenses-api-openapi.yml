    delete:
      tags:
      - Lead Source Recurring Expenses
      summary: Delete a Lead Source Recurring Expense
      description: Deletes a new Lead Source Recurring Expense that belongs to a Lead Source
      operationId: deleteLeadSourceRecurringExpense
      parameters:
      - name: lead_source_id
        in: path
        description: The ID of the lead source this recurring expense belongs to
        required: true
        schema:
          type: string
      - name: lead_source_recurring_expense_id
        in: path
        description: The ID of a lead source recurring expense
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: No Content
    patch:
      tags:
      - Lead Source Recurring Expenses
      summary: Update a Lead Source Recurring Expense
      description: Updates a Lead Source Recurring Expense
      operationId: updateLeadSourceRecurringExpense
      parameters:
      - name: lead_source_id
        in: path
        description: The ID of the lead source this recurring expense belongs to
        required: true
        schema:
          type: string
      - name: lead_source_recurring_expense_id
        in: path
        description: The ID of a lead source recurring expense
        required: true
        schema:
          type: string
      - name: update_mask
        in: query
        description: An optional list of properties to be updated. If set, only the provided properties
          will be updated and others will be skipped.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - notes
            - amount
            - start_time
            - end_time
          uniqueItems: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadSourceRecurringExpenseUpdateRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
