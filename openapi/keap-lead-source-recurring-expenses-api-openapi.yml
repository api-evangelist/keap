  version: v2
servers:
- url: https://api.infusionsoft.com/crm
tags:
- name: Lead Source Recurring Expenses
paths:
  /rest/v2/leadSources/{lead_source_id}/recurringExpenses:
    get:
      tags:
      - Lead Source Recurring Expenses
      summary: Retrieves a list of lead source recurring expenses
      description: Retrieves a list of recurring expenses with lead_source_id and optional 'filter' query
        param
      operationId: listLeadSourceRecurringExpenses
      parameters:
      - name: lead_source_id
        in: path
        description: The ID of the lead source this recurring expense belongs to. Use '-' as a wildcard
          to list recurring expenses across all lead sources.
        required: true
        schema:
          type: string
        example: '-'
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:


          - (String) `title`

          - (Long) `amount`

          - (String) `start_time`

          - (String) `end_time`

          - (String) `next_expense_time`

          - (String) `create_time`

          - (String) `update_time`


          You will need to apply the `==` operator to check the equality of one of the filters with your
          searched

          word, in the encoded form `%3D%3D`. For the filters listed above, here are some examples:


          - `filter=amount%3D%3D2500`

          - `filter=next_expense_time%3D%3D2024-12-22T01:00:00.000Z`'
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `title`

          - `amount`

          - `start_time`

          - `end_time`

          - `next_expense_time`

          - `create_time`

          - `update_time`


          One of the following directions:

          - `asc`

          - `desc`'
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLeadSourceRecurringExpensesResponse'
    post:
      tags:
      - Lead Source Recurring Expenses
      summary: Create a Lead Source Recurring Expense
      description: Creates a new Lead Source Recurring Expense
      operationId: createLeadSourceRecurringExpense
      parameters:
      - name: lead_source_id
        in: path
        description: The ID of the lead source this recurring expense belongs to
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadSourceRecurringExpenseRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
