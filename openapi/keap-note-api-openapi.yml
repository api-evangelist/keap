  /rest/v2/notes:
    get:
      tags:
      - Note
      summary: List All Notes
      description: Retrieves a list of all notes
      operationId: listAllNotes
      parameters:
      - name: filter
        in: query
        description: "Filter to apply. Allowed fields and operators:\n- (String) `id` — supports `==`,\
          \ `!=`, `>`, `<`, `>=`, `<=`\n- (String list) `ids` — comma-separated note ids, supports `==`\
          \ only (e.g. `ids==1,2,3`)\n- (String) `title` — supports `==`. Bare value matches anywhere\
          \ in the title (contains).\n   Wildcard prefix match also supported (e.g. `title==Follow*`)\n\
          - (String) `contact_id`\n- (String) `assigned_to_user_id`\n- (String) `since_time` — ISO-8601\
          \ date/time\n- (String) `until_time` — ISO-8601 date/time\n\nOperators must be URL-encoded.\
          \ Common encodings:\n`==` → `%3D%3D`, `!=` → `!%3D`, `>` → `%3E`, `<` → `%3C`,\n`>=` → `%3E%3D`,\
          \ `<=` → `%3C%3D`, `*` → `%2A`.\n\nMultiple filters are combined with AND using `;`.\n\nExamples:\n\
          - `filter=contact_id%3D%3D1001`\n- `filter=id%3E5`\n- `filter=ids%3D%3D1,2,3`\n- `filter=title%3D%3DFollow%2A`\n\
          - `filter=since_time%3D%3D2025-04-16T20:33:02.321Z`\n- `filter=until_time%3D%3D2025-08-16T20:33:02.321Z`\n\
          \nCustom fields (when enabled) can be filtered by their field name (case-insensitive).\nA standard\
          \ field above takes precedence over a custom field with the same name.\nSupported operators\
          \ depend on the custom field's type:\n- Text-like fields and single-value choice fields with\
          \ text options (dropdown, radio, state): `==` only, with optional trailing wildcard (e.g. `Priority%3D%3DHigh%2A`)\n\
          - Yes/No and drilldown fields: `==` only\n- Numeric fields (including user, month, day of week):\
          \ `==`, `>`, `<`, `>=`, `<=`\n- Date fields: `==`, `>`, `<`, `>=`, `<=` using full ISO 8601\n\
          - Multi-select fields: `==` matches records that contain the given option\nExample (for a custom\
          \ field named `Priority`): `filter=Priority%3D%3DHigh`\n\nNotes:\n- `id` and `ids` cannot be\
          \ combined in the same request.\n- Wildcard `*` may only appear at the end of the value (prefix\
          \ match).\n   Leading wildcards (`*foo`, `*foo*`) are rejected for performance reasons.\n"
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `id`

          - `create_time`

          - `update_time`


          One of the following directions:

          - `asc`

          - `desc`'
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      - name: fields
        in: query
        description: 'Comma-delimited list of optional Note properties to include in the response. Allowed
          values: custom_fields'
        required: false
        schema:
          type: string
          enum:
          - custom_fields
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
