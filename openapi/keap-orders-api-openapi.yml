          - PRODUCT
          - SHIPPING
          - TAX
          - SERVICE
          - UPSELL
          - FINANCE_CHARGE
          - DISCOUNT
          - PROGRAM
          - SUBSCRIPTION
          - DISCOUNT_FREE_TRIAL
          - DISCOUNT_ORDER_TOTAL
          - DISCOUNT_PRODUCT
          - DISCOUNT_PRODUCT_CATEGORY
          - DISCOUNT_SHIPPING
          - TIP
          - OTHER
          - FEE
          - UNKNOWN
          example: PRODUCT
        cost_per_unit:
