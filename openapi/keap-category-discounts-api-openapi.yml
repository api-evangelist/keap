tags:
- name: Category Discounts
paths:
  /rest/v2/discounts/productCategories:
    get:
      tags:
      - Category Discounts
      summary: List Category Discounts
      description: Retrieves a list of Category Discounts
      operationId: listCategoryDiscounts
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, the allowed field is:

          - (String) `id` - Allowable operators: "==","<=", "<", ">=", ">", "!="

          - (List[String]) `ids`

          - (String) `name` - Wildcard matching allowed

          - (String) `description` - Wildcard matching allowed

          - (String) `product_category_id`


          You will need to apply the `==` operator to check the equality of the filter with your searched

          word, in the encoded form `%3D%3D`. For the filters listed above, here are some examples:

          - `filter=product_category_id%3D%3D4`

          - `filter=ids%3D%3D1,10,4,24`

          - `filter=id%3E5`


          For fields which allow wildcard matching, you may use the * wildcard character (or its encoded
          form %2A)

          for case-insensitive partial matching on text fields. Example of a valid pattern of wildcard
          usage:

          - `description==foo*` finds anything in `description` that begins with `foo`


          '
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `id`

          - `name`


          One of the following directions:

          - `asc`

          - `desc`'
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Method Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoryDiscountsResponse'
    post:
      tags:
      - Category Discounts
      summary: Create a Category Discount
      description: Creates a Category Discount
      operationId: createCategoryDiscount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryDiscountRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
