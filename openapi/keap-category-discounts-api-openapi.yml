  /rest/v2/discounts/productCategories/{discount_id}/criteria/{criteria_id}:
    delete:
      tags:
      - Category Discounts
      summary: Delete a Category Discount Criteria
      description: Deletes a specified Category Discount Criteria
      operationId: deleteCategoryDiscountCriteria
      parameters:
      - name: discount_id
        in: path
        required: true
        schema:
          type: string
      - name: criteria_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
