        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFreeTrialDiscountsResponse'
    post:
      tags:
      - Free Trial Discounts
      summary: Create a Subscription Free Trial Discount
