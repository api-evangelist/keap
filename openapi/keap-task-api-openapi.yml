        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
    post:
      tags:
      - Task
      summary: Create a Task
      description: Creates a new task as the authenticated user.
      operationId: createTask
