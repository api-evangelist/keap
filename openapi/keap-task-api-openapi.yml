components:
  schemas:
    CreateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        tab_id:
          type: string
    CreateCustomFieldOptionRequest:
      type: object
      properties:
        label:
          type: string
    CreateCustomFieldRequest:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreateCustomFieldOptionRequest'
        field_type:
          type: string
          enum:
          - CURRENCY
          - DATE
          - DATE_TIME
          - DAY_OF_WEEK
          - DECIMAL_NUMBER
          - DRILLDOWN
          - DROPDOWN
          - EMAIL
          - LIST_BOX
          - MONTH
          - NAME
          - PERCENT
          - PHONE_NUMBER
          - RADIO
          - SOCIAL_SECURITY_NUMBER
          - STATE
          - TEXT
          - TEXT_AREA
          - USER
          - USER_LIST_BOX
          - WEBSITE
          - WHOLE_NUMBER
          - YEAR
          - YES_NO
        group_id:
          type: string
          description: An optional tab group to place the field under in the interface.  If not specified,
            will default to the 'Custom Fields' tab.
        user_group_id:
          type: string
          description: An optional user group to choose from when selecting values for User or UserListBox
            fields.
      required:
      - field_type
      - label
    CreateCustomFieldResponse:
      type: object
      properties:
        custom_field:
          $ref: '#/components/schemas/CustomFieldMetaData'
    CreateCustomFieldTabRequest:
      type: object
      properties:
        name:
          type: string
    CreateTaskRequest:
      type: object
      description: task
      properties:
        title:
          type: string
          description: Task title
          example: Follow up on proposal
        description:
          type: string
          description: Task description
          example: Review client feedback
        type:
          type: string
          description: Task type
          example: CALL
        priority:
          type: string
          description: Task priority
          enum:
          - CRITICAL
          - ESSENTIAL
          - NONESSENTIAL
          example: ESSENTIAL
        completed:
          type: boolean
          description: Whether task is completed
          example: false
        completion_time:
          type: string
          description: Completion timestamp (ISO-8601)
          example: '2024-03-20T14:00:00Z'
        due_time:
          type: string
          description: Due date/time (ISO-8601)
          example: '2024-03-18T17:00:00Z'
        remind_time_mins:
          type: integer
          format: int32
          description: Value in minutes before start_date to show pop-up reminder.
          enum:
          - '5'
          - '10'
          - '15'
          - '30'
          - '60'
          - '120'
          - '240'
          - '480'
          - '1440'
          - '2880'
          example: 30
        assigned_to_user_id:
          type: string
          description: Assigned user ID
          example: 456
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        opportunity_id:
          type: string
          description: Associated opportunity ID
          example: 553
        accepted:
          type: boolean
          description: Whether the task has been accepted.
          example: true
        custom_fields:
          type: array
          description: Custom field values for the task. An empty array resets all custom fields to their
            defaults.
          example:
          - id: '1'
            content: Red
          items:
            $ref: '#/components/schemas/CustomFieldValueObject'
      required:
      - assigned_to_user_id
    CreateUpdateTaskRequest:
      type: object
      description: task
      properties:
        title:
          type: string
          description: Task title
          example: Follow up on proposal
        description:
          type: string
          description: Task description
          example: Review client feedback
        type:
          type: string
          description: Task type
          example: CALL
        priority:
          type: string
          description: Task priority
          enum:
          - CRITICAL
          - ESSENTIAL
          - NONESSENTIAL
          example: ESSENTIAL
        completed:
          type: boolean
          description: Whether task is completed
          example: false
        completion_time:
          type: string
          description: Completion timestamp (ISO-8601)
          example: '2024-03-20T14:00:00Z'
        due_time:
          type: string
          description: Due date/time (ISO-8601)
          example: '2024-03-18T17:00:00Z'
        remind_time_mins:
          type: integer
          format: int32
          description: Value in minutes before start_date to show pop-up reminder.
          enum:
          - '5'
          - '10'
          - '15'
          - '30'
          - '60'
          - '120'
          - '240'
          - '480'
          - '1440'
          - '2880'
          example: 30
        assigned_to_user_id:
          type: string
          description: Assigned user ID
          example: 456
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        opportunity_id:
          type: string
          description: Associated opportunity ID
          example: 77
        accepted:
          type: boolean
          description: Whether the task has been accepted. Defaults to false
          example: true
        custom_fields:
          type: array
          description: Custom field values for the task. An empty array resets all custom fields to their
            defaults.
          example:
          - id: '1'
            content: Red
          items:
            $ref: '#/components/schemas/CustomFieldValueObject'
    CustomFieldGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        tab_id:
          type: string
        record_type:
          type: string
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
    CustomFieldMetaData:
      type: object
      description: Metadata describing a custom field, including its type and options
      properties:
        id:
          type: string
          description: The unique identifier of the custom field
          example: 123
        label:
          type: string
          description: The display label of the custom field
          example: Favorite Color
        options:
          type: array
          description: The list of available options for select/radio/multiselect/drilldown field types
          items:
            $ref: '#/components/schemas/CustomFieldOption'
        record_type:
          type: string
          description: The entity type this custom field belongs to (e.g. CONTACT, COMPANY)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
        field_type:
          type: string
          description: The data type of the custom field (e.g. Text, Number, Date, Select)
          enum:
          - CURRENCY
          - DATE
          - DATE_TIME
          - DAY_OF_WEEK
          - DECIMAL_NUMBER
          - DRILLDOWN
          - DROPDOWN
          - EMAIL
          - LIST_BOX
          - MONTH
          - NAME
          - PERCENT
          - PHONE_NUMBER
          - RADIO
          - SOCIAL_SECURITY_NUMBER
          - STATE
          - TEXT
          - TEXT_AREA
          - USER
          - USER_LIST_BOX
          - WEBSITE
          - WHOLE_NUMBER
          - YEAR
          - YES_NO
        default_value:
          type: string
          description: The default value for this custom field, if any
        group_id:
          type: string
          description: The ID of the group this custom field belongs to
          example: 45
        group_name:
          type: string
          description: The name of the group this custom field belongs to
          example: Personal Info
        field_name:
          type: string
          description: The database column name for this custom field. Use this value when filtering contacts
            (e.g. for field_name 'firstName1', filter with 'firstName1==John').
          example: firstName1
    CustomFieldOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
    CustomFieldTab:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the custom field tab
          example: 123
        name:
          type: string
          description: The name of the custom field tab
          example: Personal Info
        order:
          type: integer
          format: int32
          description: The display order of the tab
          example: 1
        record_type:
          type: string
          description: The record type this tab belongs to (e.g., CONTACT, COMPANY, OPPORTUNITY, REFERRAL_PARTNER,
            ORDER, SUBSCRIPTION, TASK_NOTE_APPOINTMENT)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
          example: CONTACT
    CustomFieldValueObject:
      type: object
      properties:
        id:
          type: string
        content:
          description: The value of the custom field. Text custom field values have a maximum length of
            65535 characters.
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    ListCustomFieldGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldGroup'
    ListCustomFieldTabsResponse:
      type: object
      properties:
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldTab'
    ListTasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_page_token:
          type: string
    ObjectModel:
      type: object
      properties:
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldMetaData'
        optional_properties:
          type: array
          description: These fields are not transmitted by default on this model, but can be requested
            by specifying them in a comma-separated list in the optional_properties query parameter.
          items:
            type: string
          uniqueItems: true
    Task:
      type: object
      properties:
        id:
          type: string
          description: Task ID
          example: 123
        title:
          type: string
          description: Task title
          example: Follow up on proposal
        description:
          type: string
          description: Task description. Legacy XML-RPC name for this field was `CreationNotes`
          example: Review and respond to client feedback.
        type:
          type: string
          description: Task type
          example: CALL
        priority:
          type: string
          description: Task priority
          enum:
          - CRITICAL
          - ESSENTIAL
          - NONESSENTIAL
          example: CRITICAL
        completed:
          type: boolean
          description: Whether task is completed
          example: false
        create_time:
          type: string
          description: Creation timestamp (ISO-8601)
          example: '2024-01-10T08:00:00Z'
        modification_time:
          type: string
          description: Last modification timestamp (ISO-8601)
          example: '2024-03-15T10:30:00Z'
        completion_time:
          type: string
          description: Completion timestamp (ISO-8601)
          example: '2024-03-20T14:00:00Z'
        due_time:
          type: string
          description: Due date/time (ISO-8601)
          example: '2024-03-18T17:00:00Z'
        remind_time_mins:
          type: integer
          format: int32
          description: Reminder minutes before due.
          enum:
          - '5'
          - '10'
          - '15'
          - '30'
          - '60'
          - '120'
          - '240'
          - '480'
          - '1440'
          - '2880'
          example: 30
        assigned_to_user_id:
          type: string
          description: Assigned user ID
          example: 456
        created_by_user_id:
          type: string
          description: Creator user ID
          example: 789
        last_updated_by_user_id:
          type: string
          description: User who last updated the task.
          example: 77
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        opportunity_id:
          type: string
          description: Associated opportunity ID
          example: 321
        accepted:
          type: boolean
          description: Whether the task has been accepted
          example: true
        custom_fields:
          type: array
          description: Custom field values for the task
          example:
          - id: '1'
            content: Red
          - id: '2'
            content: Preferred
          items:
            $ref: '#/components/schemas/CustomFieldValueObject'
    UpdateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
          format: int32
        tab_id:
          type: string
    UpdateCustomFieldMetaDataRequest:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldOption'
        group_id:
          type: string
      required:
      - group_id
    UpdateCustomFieldTabRequest:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
          format: int32
    UpdateTaskResponse:
      type: object
      properties:
        id:
          type: string
          description: Task ID
          example: 123
        title:
          type: string
          description: Task title
          example: Follow up on proposal
        description:
          type: string
          description: Task description. Legacy XML-RPC name for this field was `CreationNotes`
          example: Review and respond to client feedback.
        type:
          type: string
          description: Task type
          example: CALL
        priority:
          type: string
          description: Task priority
          enum:
          - CRITICAL
          - ESSENTIAL
          - NONESSENTIAL
          example: CRITICAL
        completed:
          type: boolean
          description: Whether task is completed
          example: false
        create_time:
          type: string
          description: Creation timestamp (ISO-8601)
          example: '2024-01-10T08:00:00Z'
        modification_time:
          type: string
          description: Last modification timestamp (ISO-8601)
          example: '2024-03-15T10:30:00Z'
        completion_time:
          type: string
          description: Completion timestamp (ISO-8601)
          example: '2024-03-20T14:00:00Z'
        due_time:
          type: string
          description: Due date/time (ISO-8601)
          example: '2024-03-18T17:00:00Z'
        remind_time_mins:
          type: integer
          format: int32
          description: Reminder minutes before due.
          enum:
          - '5'
          - '10'
          - '15'
          - '30'
          - '60'
          - '120'
          - '240'
          - '480'
          - '1440'
          - '2880'
          example: 30
        assigned_to_user_id:
          type: string
          description: Assigned user ID
          example: 456
        created_by_user_id:
          type: string
          description: Creator user ID
          example: 789
        last_updated_by_user_id:
          type: string
          description: User who last updated the task.
          example: 77
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        opportunity_id:
          type: string
          description: Associated opportunity ID
          example: 321
        accepted:
          type: boolean
          description: Whether the task has been accepted
          example: true
        custom_fields:
          type: array
          description: Custom field values for the task
          example:
          - id: '1'
            content: Red
          - id: '2'
            content: Preferred
          items:
            $ref: '#/components/schemas/CustomFieldValueObject'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.infusionsoft.com/app/oauth/authorize
          tokenUrl: https://api.infusionsoft.com/token
          scopes: {}
security:
- oauth2: []
