components:
  schemas:
    AffiliateAddToProgramRequest:
      type: object
      properties:
        affiliate_program_id:
          type: string
    AffiliateCommission:
      type: object
      properties:
        description:
          type: string
          description: Description of the product or line item associated with this commission
          example: Commission for product sale
        amount_earned:
          type: number
          format: double
          description: Amount earned for this commission
          example: 25.0
        contact_first_name:
          type: string
          description: First name of the contact associated with this commission
          example: John
        contact_last_name:
          type: string
          description: Last name of the contact associated with this commission
          example: Doe
        invoice_id:
          type: string
          description: ID of the invoice associated with this commission
          example: 1001
        time_earned:
          type: string
          description: When the commission was earned. In ISO-8601 format
          example: '2024-06-15T14:30:00Z'
        contact_id:
          type: string
          description: ID of the contact associated with this commission
          example: 1001
        sales_affiliate_id:
          type: string
          description: ID of the sales affiliate
          example: 123
        sales_affiliate_name:
          type: string
          description: The name of the sales affiliate
          example: Jane Smith
        product_name:
          type: string
          description: Name of the product or line item associated with this commission
          example: Premium Membership
    AffiliateCommissionEarned:
      type: object
      properties:
        affiliate_commission_total:
          type: number
          format: double
          description: Total commission earned by affiliate
          example: 1250.5
        view_ledger_url:
          type: string
          description: URL to view affiliate ledger
          example: https://app.thryv.com/affiliate/ledger?affiliateId=123
    AffiliateCommissionProgramResponse:
      type: object
      properties:
        id:
          type: string
          description: Commission program ID
          example: 100
        name:
          type: string
          description: Program name
          example: Gold Partner Program
        notes:
          type: string
          description: Program notes
          example: 20% commission on all sales
        priority:
          type: integer
          format: int32
          description: Program priority
          example: 1
    AffiliateLink:
      type: object
      properties:
        id:
          type: string
          description: Affiliate link ID
          example: 789
        name:
          type: string
          description: Link name
          example: Fitness Program
        code:
          type: string
          description: URL code for tracking
          example: fP100
        affiliate_id:
          type: string
          description: Associated affiliate ID
          example: 123
        local_url_code:
          type: string
          deprecated: true
          description: 'URL code for tracking. Deprecated: use ''code'' instead.'
          example: fP100
        redirect_url:
          type: string
          deprecated: true
          description: Destination URL. This field is deprecated. Use 'website_address' instead.
          example: https://thryv.com/fitness
        website_address:
          type: string
          description: Destination URL
          example: https://thryv.com/fitness
        program_ids:
          type: array
          description: Associated program IDs
          example:
          - '1'
          - '2'
          items:
            type: string
        date_created:
          type: string
          description: Date link was created (ISO-8601)
          example: '2024-03-15T10:30:00Z'
    AffiliateProgramResource:
      type: object
      properties:
        id:
          type: string
          description: The program resource identifier
          example: 101
        title:
          type: string
          description: The program resource title
          example: Summer Sale Banner
        type:
          type: string
          description: The type of resource
          enum:
          - EMAIL
          - BANNER
          - PAGE
          example: BANNER
        notes:
          type: string
          description: The resource notes.
          example: Use this banner for summer promotions
        url:
          type: string
          description: The URL to the resource.
          example: https://thryv.com/banners/summer-sale.jpg
        order:
          type: integer
          format: int32
          description: The order which the resource to be displayed. Minimum value is 0. Lower values
            indicate higher priority.
          example: 1
        content_html:
          type: string
          description: The contents of the PAGE or EMAIL. In HTML format.
          example: <h1>Summer Sale</h1><p>Get 20% off!</p>
        page_width:
          type: integer
          format: int32
          description: The width of the page for PAGE types, in pixels.
          example: 728
        page_height:
          type: integer
          format: int32
          description: The height of the page for PAGE types, in pixels.
          example: 90
        commission_programs:
          type: array
          description: A list of commission programs using this resource.
          items:
            $ref: '#/components/schemas/ResourceCommissionProgram'
    AffiliateProgramV2:
      type: object
      properties:
        id:
          type: string
          description: Commission program ID
          example: 1
        name:
          type: string
          description: The affiliate commission program name
          example: commission program
        priority:
          type: string
          description: The Affiliate commission program priority
          example: 0
        notes:
          type: string
          description: The affiliate commission program notes
          example: notes for the commission program
        create_time:
          type: string
          description: The created time of affiliate commission program
          example: '2019-08-24T14:15:22Z'
        affiliate_ids:
          type: array
          description: The list of affiliate_ids using this commission program
          example:
          - 123
          - 124
          items:
            type: string
    AffiliateRemoveFromProgramRequest:
      type: object
      properties:
        affiliate_program_id:
          type: string
    AffiliateSummaryRecord:
      type: object
      properties:
        affiliateId:
          type: integer
          format: int64
        clawbacks:
          type: number
          format: double
        balance:
          type: number
          format: double
        amountEarned:
          type: number
          format: double
    CommissionItem:
      type: object
      properties:
        sale_percent:
          type: number
          format: double
          description: The percentage to be paid for Sale.
          example: 10.5
        sale_amount:
          type: number
          format: double
          description: The fixed dollar amount to be paid for Sale.
          example: 25.0
        lead_percent:
          type: number
          format: double
          description: The percentage to be paid for Lead.
          example: 10.5
        lead_amount:
          type: number
          format: double
          description: The fixed dollar amount to be paid for Lead.
          example: 25.0
    CommissionItemRequest:
      type: object
      properties:
        sale_percent:
          type: string
          description: The percentage to be paid for Sale.
          example: 10.5
        sale_amount:
          type: string
          description: The fixed dollar amount to be paid for Sale.
          example: 25.0
        lead_percent:
          type: string
          description: The percentage to be paid for Lead.
          example: 10.5
        lead_amount:
          type: string
          description: The fixed dollar amount to be paid for Lead.
          example: 25.0
    CreateAffiliateRequest:
      type: object
      properties:
        code:
          type: string
          description: 'The Affiliate code which have some validations.

            1. The code should not have white spaces

            2. The code should starts with letters

            3. The code minimum 4 characters length'
          example: M123
        status:
          type: string
          default: INACTIVE
          description: The Affiliate Status
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        name:
          type: string
          description: 'The Affiliate name will be derived from the Contact,

            when not explicitly provided'
          example: John Smith
        contact_id:
          type: string
          description: The contactId identifier , Must be a positive number
          example: 1
        parent_affiliate_id:
          type: string
          description: The Parent Affiliate Id
          example: 0
        notify_on_sale:
          type: boolean
          description: Whether to notify on sale events
          example: true
        notify_on_lead:
          type: boolean
          description: Whether to notify on lead events
          example: true
        track_leads_days:
          type: integer
          format: int32
          description: Number of days to track leads
          example: 30
        password:
          type: string
          description: Affiliate portal password
        custom_fields:
          type: array
          description: List of custom field values to apply to this affiliate
          example:
          - id: '1'
            content: VIP
          - id: '2'
            content: Preferred
          items:
            $ref: '#/components/schemas/CustomFieldValue'
      required:
      - code
      - contact_id
    CreateCommissionProgramRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the Commission Program
          example: Fitness program
        notes:
          type: string
          description: The notes of the Commission Program
          example: 20% default commission
        priority:
          type: integer
          format: int32
          description: The priority of the Commission Program
          example: 1
      required:
      - name
      - priority
    CreateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        tab_id:
          type: string
    CreateCustomFieldOptionRequest:
      type: object
      properties:
        label:
          type: string
    CreateCustomFieldRequest:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreateCustomFieldOptionRequest'
        field_type:
          type: string
          enum:
          - CURRENCY
          - DATE
