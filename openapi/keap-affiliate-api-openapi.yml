  /rest/v2/affiliates:
    get:
      tags:
      - Affiliate
      summary: List Affiliates
      description: Retrieves a list of Affiliates
      operationId: listAffiliate
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:

          - (String) `id` - Allowable operators: "==","<=", "<", ">=", ">", "!="

          - (String) `name` - Wildcard matching allowed

          - (String) `contact_id`

          - (String) `referral_contact_id`

          - (String) `status`

          - (String) `code`

          - (Custom) Custom field names - Reference by field name (e.g., `tier`, `region`)


          You will need to apply the `==` operator to check the equality of one of the filters with the

          value you want to match, in the encoded form `%3D%3D`. For the filters listed above,

          here are some examples:

          - `filter=id%3C123`

          - `filter=id%3D%3D123`

          - `filter=name%3D%3DBob`

          - `filter=contact_id%3D%3D567`

          - `filter=contact_id%3D%3D123%3Bcode%3D%3D567`


          For fields which allow wildcard matching, you may use the * wildcard character (or its encoded
          form %2A)

          for case-insensitive partial matching on text fields. Example of a valid pattern of wildcard
          usage:

          - `field==foo*` finds anything in `field` that begins with `foo`


          Custom Field Filtering:

          Custom fields are referenced by their field name as configured in the system.

          Standard field names take precedence over custom field names.


          Supported operators by field type:

          - Text fields and single-value choice fields with text options (dropdown, radio, state): ==,
          and wildcard support (e.g., `value*`)

          - Numeric fields (including user, month, day of week): ==, <, <=, >, >=

          - Date fields: ==, <, <=, >, >= (ISO 8601 format)

          - Yes/No and drilldown fields: ==

          - Multi-select fields: == (matches if value is present)


          Examples of custom field filtering:

          - `filter=tier%3D%3DPlatinum` - Text field exact match

          - `filter=region%3D%3DWest%2A` - Text field with wildcard (starts with "West")

          - `filter=revenue%3E100000` - Numeric field greater than 100000

          - `filter=join_date%3E%3D2024-01-01` - Date field on or after Jan 1, 2024

          - `filter=name%3D%3DBob%3Btier%3D%3DGold` - Combine standard and custom fields


          Note: Leading wildcards (e.g., `*value`) are not supported for performance reasons.

          Only prefix wildcards (e.g., `value*`) are allowed.

          '
        required: false
        schema:
          type: string
      - name: page_token
        in: query
        description: Page token
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `id`

          - `date_created`

          - `name`

          - `status`

          - `code`


          One of the following directions:

          - `asc`

          - `desc`

          '
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        example: 0
      responses:
        '401':
